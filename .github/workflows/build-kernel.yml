name: Build Xiaomi Redmi Note 10 5G (AOSP Based A13) (Kernel 4.14)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "camellia"
  DEVICE_CODENAME : "camellia"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  # 👇 CLEAN SOURCE (camellia-devs) 👇
  KERNEL_SOURCE : "https://github.com/camellia-devs/kernel_xiaomi_mt6833.git"
  KERNEL_BRANCH : "flyme"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "camellia_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "bakasu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : "false"
  SUSFS_FOLDER_FIXED: ""

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "aosp_a13_4.14"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "op_kernel"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "true"

  # 👇 MANUAL HOOK FORCED 👇
  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Xiaomi Redmi Note 10 5G (camellia) (Kernel 4.14)
    runs-on: ubuntu-24.04
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      # 👇 MANUAL HOOK CONFIG FIX 👇
      - name: 🛠 Enforce Manual Hook in Defconfig
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG="arch/arm64/configs/camellia_defconfig"
          
          # Manual hook ON karo
          sed -i '/CONFIG_KSU_MANUAL_HOOK/d' "$DEFCONFIG"
          echo 'CONFIG_KSU_MANUAL_HOOK=y' >> "$DEFCONFIG"
          
          # SUSFS SUS_SU ko OFF karo taaki koi conflict na ho
          sed -i 's/^CONFIG_KSU_SUSFS_SUS_SU=y/# CONFIG_KSU_SUSFS_SUS_SU is not set/' "$DEFCONFIG"
          
          echo "✅ Manual Hook enforced successfully!"
      # 👆 FIX KHATAM 👆

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
