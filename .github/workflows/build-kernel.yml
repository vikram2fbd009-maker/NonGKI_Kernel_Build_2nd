name: "Xiaomi MT6833 (Stock Spoofed Build)"

on:
  workflow_dispatch: 

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Clone Kernel Source & Toolchain
        run: |
          # 1. Aapka modified kernel source clone hoga
          git clone --depth 1 --single-branch --branch flyme https://github.com/camellia-devs/kernel_xiaomi_mt6833.git kernel-source
          cd kernel-source
          
          # 2. Clang 11 (r383902) - Naya Public Link
          git clone --depth 1 https://github.com/picasso09/clang-11.0.1-r383902.git prebuilts/clang/host/linux-x86/clang-r383902
          
          # 3. GCC 4.9 - Naya Public Link (aarch64-linux-android-4.9)
          git clone --depth 1 https://github.com/aosp-project/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

      - name: Compile Kernel
        run: |
          cd kernel-source
          
          # Toolchain paths set karein (GCC path ab aarch64-linux-android-4.9 hai)
          export PATH=$PWD/prebuilts/clang/host/linux-x86/clang-r383902/bin:$PWD/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$PATH
          
          export ARCH=arm64
          export SUBARCH=arm64
          # CROSS_COMPILE ab android ke liye set hai
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Defconfig load karein
          make O=out ARCH=arm64 camellia_defconfig
          
          # Build start karein
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- 2>&1 | tee kernel.log

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel-source/out/arch/arm64/boot/Image*
